
version: 2.1

jobs:
  php:
    docker:
      - image: cimg/php:8.1
    steps:
      - checkout

      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-

      - run:
          name: Check PHP version
          command: php --version

      - run:
          name: Install PHP dependencies
          command: composer install --prefer-dist --no-interaction --no-progress

      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor

      - run:
          name: Run PHP tests with Pest
          command: vendor/bin/pest
          environment:
            APP_ENV: testing
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            DB_CONNECTION: sqlite
            DB_DATABASE: ":memory:"
            CACHE_DRIVER: array
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync

  frontend:
    docker:
      - image: cimg/php:8.1
    steps:
      - checkout

      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install Node.js 18
          command: |
            curl -fsSL https://deb.nodesource.com/setup_18.x -o /tmp/nodesource_setup.sh
            sudo bash /tmp/nodesource_setup.sh
            sudo apt-get install -y nodejs
            node --version
            npm --version

      - run:
          name: Install PHP dependencies for Laravel Vite
          command: composer install --prefer-dist --no-interaction --no-progress

      - run:
          name: Install frontend dependencies
          command: npm ci --legacy-peer-deps

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      
      - run:
          name: Build frontend assets
          command: NODE_OPTIONS="--max-old-space-size=4096" npm run build
          environment:
            APP_ENV: production
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=


      - run:
          name: Run frontend tests
          command: npm test

workflows:
  starter:
    jobs:
      - php
      - frontend
